    - article [ref=f2e29]:
      - paragraph [ref=f2e1055]: 第一章 剑罡同流
      - paragraph [ref=f2e1056]: 焦宏进一个翻身抽出大刀，弹离椅子，移到厢房望往后院的隔窗，尚未站稳，已怒吼一声，往后弯腰仰身。
      - paragraph [ref=f2e1057]: “嗤嗤”连声，七、八枝劲箭在他后仰的面门上方数寸间闪电掠过，插进厢房墙壁和梁柱去。
      - paragraph [ref=f2e1058]: 箭簇仍在晃颤之际，门外传来的步音骤止。
      - paragraph [ref=f2e1059]: “砰”！
      - paragraph [ref=f2e1060]: 房门被重重踢开，手持利器的大汉如狼似虎般二话不说冲入房来。
      - paragraph [ref=f2e1061]: 寇仲一声长笑，学焦宏进般从椅子翻起，却双手握紧椅背边沿，两脚闪电后撑，在敌人斩脚前，正中当先两人胸口。
      - paragraph [ref=f2e1062]: 胸骨碎折的声音惊心动魄的响起，两名大汉七孔喷血，兵器脱手，像被狂风刮起般往后断线风筝地抛掷，把后面正向门口拥进来的大汉撞得人仰马翻，骨折肉裂，倒下六、七个，没有半个可以爬得起来。
      - paragraph [ref=f2e1063]: 尖叫声在邻房传至。
      - paragraph [ref=f2e1064]: 寇仲双足落地，同一脸愤然的焦宏进道：“让我们引走敌人，免得他们误伤无辜。”
      - paragraph [ref=f2e1065]: 身子往上腾起，破顶而出。
      - paragraph [ref=f2e1066]: 焦宏进听得呆一呆，然后才循他撞破的洞口来到瓦面处。
      - paragraph [ref=f2e1067]: 寇仲正把埋伏在瓦面的箭手杀得狼奔鼠窜，纷纷从两边檐顶滚下去。
      - paragraph [ref=f2e1068]: 楼房和院墙间的空地满是火把，喊杀喧天，但却没有人能直接威胁到他们。
      - paragraph [ref=f2e1069]: 焦宏进移到寇仲左旁，决然道：“焦宏进的命从此就卖断给寇爷。”
      - paragraph [ref=f2e1070]: 寇仲扯他伏下，避过十多枝从地面射上来的劲箭，边观察形势，边笑道：“为何忽然如此错爱？”
      - paragraph [ref=f2e1071]: 焦宏进心悦诚服道：“在这种情况下，仍能顾及无辜，宏进不跟寇爷还跟谁呢？”
      - paragraph [ref=f2e1072]: 寇仲哈哈一笑，伸手紧揽他肩头一下，放开手道：“好兄弟！来吧！”
      - paragraph [ref=f2e1073]: 箭般贴瓦背窜下瓦檐，游鱼地朝下方投去。
      - paragraph [ref=f2e1074]: 他的速度快至肉眼难察，兼之事起突然，敌箭全部射空，他则如虎入羊群，先迅电般夺过一枝长矛，接着左挑右刺，见人便杀，守在那位置的三十多名敌人立时溃不成军，四散奔逃。
      - paragraph [ref=f2e1075]: 焦宏进跃落地面，寇仲大喝道：“来！我们顺手宰掉都任。”
      - paragraph [ref=f2e1076]: 敌人的援军分由两边杀至，喊杀声和楼房内姑娘的尖叫声浑成一片，情况混乱至极点。
      - paragraph [ref=f2e1077]: 寇仲和焦宏进一先一后，朝前院大门处车马汇集的广场杀去。由于受院内建筑空间限制，很难形成重重围攻的局面，对人少的一方自是有利无害。
      - paragraph [ref=f2e1078]: 寇仲一马当先，依沿楼而建的走廊硬闯，手中长矛化作千万道闪电般的光芒，挡路者无一幸免，不是被扫得侧跌出走廊的围栏外，便是被挑飞抛后，撞在己方的人身上，确是威风八面，挡者披靡。
      - paragraph [ref=f2e1079]: 焦宏进的武功亦相当高明，大刀上下翻飞，砍翻多个追来的敌人。
      - paragraph [ref=f2e1080]: “噗！”
      - paragraph [ref=f2e1081]: 寇仲的长矛像一道电光般扫打在一面盾牌上，震得那人连盾牌狼狈往后跌开，寇仲接着又连消带打，拨开两枝刺来的长枪，但心中却无丝毫欢喜之情，还大叫不妙。
      - paragraph [ref=f2e1082]: 此时他只差十多步，就可转入正院大门入口处的小便场，岂知忽然从转角间拥出无数刀盾手和长枪手，配合无间的截断去路，先前拦路的乌合之众则纷纷翻出围栏，好让生力军来对付他们。
      - paragraph [ref=f2e1083]: 这批枪盾手人人武功不俗，至厉害处是训练有素，兼具防守和强攻的优良能力，寇仲本来有如破竹的声势，登时化为乌有，变成逐寸逐分的争道之战。
      - paragraph [ref=f2e1084]: 后面的焦宏进立时压力大增，在且战且走中变成陷入重重围困，浴血苦战。
      - paragraph [ref=f2e1085]: 焦宏进厉叫道：“都任全心杀我，这是他的亲卫枪盾团，人数达五百之众，寇爷快走！不用理我，迟则不及。”
      - paragraph [ref=f2e1086]: 寇仲倏地退后，避过三枝疾刺而来的长枪，贴上焦宏进背脊，叫道：“要死便死在一块儿。”锐眼偷空一扫，只见走廊的围栏外除潮水般拥过来的盾手枪手外，尚有一重十多人的弓弩手，心叫不好，大喝道：“随我来！”
      - paragraph [ref=f2e1087]: “轰”！
      - paragraph [ref=f2e1088]: 寇仲硬是撞破墙壁，滚进青楼的迎客大厅去。
      - paragraph [ref=f2e1089]: ※※※
      - paragraph [ref=f2e1090]: 左游仙身量高挑，脑袋几乎光秃，鬓角边却仍保留两撮像胡子般垂下的长发，直至宽敞的肩膀处，形相特异。
      - paragraph [ref=f2e1091]: 他的年纪至少在六十过外，可是皮肤白嫩得似婴儿，长有一对山羊似的眼睛，留长垂的稀疏须子，鼻梁弯尖，充满狠邪无情的味道。
      - paragraph [ref=f2e1092]: 他身上穿的是棕灰色道袍，两手负后，稳立如山，左肩处露出佩剑的剑柄，气势迫人。
      - paragraph [ref=f2e1093]: 他双目射出深锐的目光，由上到下的打量扮成岳山的徐子陵，冷冷道：“当然不及岳兄可躲起来享清福。岳兄变得真厉害，连形影不离的宝刀也无影无踪，又改了声音，改变眼神，小弟虽有同情之意，但旧账却不能不算，只要你肯自断右手，小弟可任你离开。”
      - paragraph [ref=f2e1094]: 接着向护送座驾的十多名跃跃作势的江淮军喝道：“你们给我清场，连自己都要滚得远远的。”
      - paragraph [ref=f2e1095]: 事实上，街上的行人早四散避开，躲往店铺和横巷去。
      - paragraph [ref=f2e1096]: 徐子陵耳内响起不知藏在何处的石青璇的指示，忙哑声一笑，双目厉芒电闪，凝视两丈外的左游仙，淡然道：“左兄有辅公祏撑腰，难怪说话都神气得多。换了我未曾修成‘换日大法’之前，只凭你这句话，就要教你血溅十步之内，左兄是否相信？”
      - paragraph [ref=f2e1097]: 左游仙脸色微变，眼中掠过半信半疑的神色，沉声道：“小弟刚把‘子午罡’练至第十八重功法，正苦于无人作对手，今趟与岳兄相逢于道左，可知必是道祖眷顾，予小弟如此试法良机。”
      - paragraph [ref=f2e1098]: 徐子陵的岳山假脸随他面具后的肌肉带动露出一个诡异的笑容，而事实上他却是以笑来拖延时间，淡淡道：“‘子午罡’乃贵派‘道祖真传’两大奇功绝艺之一，与‘壬丙剑法’并列为镇派秘技，不过自贵祖长眉老道创派以来，从没有人能真正把子午罡完美融合的运用到剑法上去，左兄小心画虎不成反类犬。只要给本人找到在配合上的任何一个小破绽，左兄的试法将变成殉法，莫怪岳某人不事先明言。”
      - paragraph [ref=f2e1099]: 左游仙显是毫无怀疑地把他当作真岳山，冷笑道：“想不到岳兄对敝派的小玩艺有这么深的认识，至于小弟的剑罡同流是否仍有破绽，正要请岳兄指点。”
      - paragraph [ref=f2e1100]: “锵”！
      - paragraph [ref=f2e1101]: 左游仙宝剑离鞘，登时生出一股无坚不摧的凛冽罡气，发自遥指徐子陵的剑锋处，既凌厉霸道，又邪异阴森。
      - paragraph [ref=f2e1102]: 徐子陵心中叫苦，从石青璇以聚音成线贯入他耳鼓的指示中，得知左游仙乃邪派八大高手之一，当年排名尚在尤鸟倦之上。动起手来，自己只有全力出手保命的份儿，那时不“真相大白”才是奇迹。
      - paragraph [ref=f2e1103]: 幸好石青璇的聚音示音又到，听毕忙运功针锋相对的抗衡这元老级邪门高手的尖锐剑罡，并仰首望天，从容道：“现在是酉戌之交，左兄的子午罡该是气流于心肾之交，看指！”
      - paragraph [ref=f2e1104]: 当他说到心肾之交时，左游仙立即脸色微变，罡气减弱三分。
      - paragraph [ref=f2e1105]: “噗”！
      - paragraph [ref=f2e1106]: 两人同时晃动一下。
      - paragraph [ref=f2e1107]: 徐子陵仰天哑声大笑，发出一阵难听之极的声音，摇头叹道：“左兄果然有点门道，神虽在心肾，罡却周流于督脉，神气分离，深得往复升降，借假得真之旨。左兄仍要以身试法吗？”
      - paragraph [ref=f2e1108]: 左游仙终于掩不住惊容，厉声道：“你怎知敝派神气分离之法。”
      - paragraph [ref=f2e1109]: 今次连隐于一侧巷内的石青璇都大惑不解，不明白为何徐子陵只和对方作试探式的略拼一招，便像洞穿对方肺腑似的把握到个中玄虚。左游仙自然更是惊骇欲绝。
      - paragraph [ref=f2e1110]: 岂知徐子陵和寇仲均有只他两个懂得的独门秘技，就是能借入侵对手体内的劲气，探测对方经脉的虚实，所以天下间点脉截脉的手法虽千门万类，但却没有一种手法能瞒过他们。
      - paragraph [ref=f2e1111]: 适才那一指他是故意在指风中暗藏微若游丝的螺旋劲，在敌人似知非知间钻入对方经脉去，探察出敌情来。
      - paragraph [ref=f2e1112]: 那也是左游仙剑罡同流的唯一破绽，就是神气分离，使他在某一种形势下，剑罡会出现断层式的空隙，知情者自可利用这一良机，令他落败。其中情况微妙至极点。
      - paragraph [ref=f2e1113]: 扪心自问，徐子陵自知没有本领可逼得左游仙露出如此破绽，但因从石青璇的指示中知此老道生性多疑，故以岳山的身份摆出吃定对方的姿态，好能从容“逃命”。
      - paragraph [ref=f2e1114]: 这时见左游仙中计，忙依石青璇继续传入耳内的指示再来记软的，好让双方均能体面地步下台阶，冷哼道：“左兄与小弟的所谓过节，只是意气之争，左兄若对四十年前的旧事仍介怀在意，岳某人绝对奉陪，不过左兄该知本人的习惯，一旦出手，不死不休。”
      - paragraph [ref=f2e1115]: 左游仙的脸容冷静下来，狠狠盯着徐子陵，好一会儿才像泄了气般点头叹道：“岳兄责怪得好！说到底我们总曾是朋友，只不知岳兄今次重出江湖，是否要找宋缺雪那一刀之恨？”
      - paragraph [ref=f2e1116]: 徐子陵冷哂道：“若非岳某人以宋缺为重，今天肯这么低声下气，对你好言相劝吗？”
      - paragraph [ref=f2e1117]: 左游仙不知是否一向听惯岳山这种说话方式，不以为忤的道：“理该如此！际此风云四起之际，个人恩怨只是小事。岳兄有没有兴趣坐下来饮两杯水酒，看看有什么可合作的地方。”
      - paragraph [ref=f2e1118]: 徐子陵淡淡道：“待我斩下宋缺的首级，再来找左兄饮酒庆祝。”
      - paragraph [ref=f2e1119]: 哑笑两声，飘逸潇洒的转身溜之大吉。
      - paragraph [ref=f2e1120]: ※※※
      - paragraph [ref=f2e1121]: 尖叫四起。
      - paragraph [ref=f2e1122]: 刚从楼上逃下来的妓女宾客，见两人破墙进入迎客大堂，怕殃及池鱼，又往楼上逃回去，狼狈混乱，仿如末日来临。
      - paragraph [ref=f2e1123]: 寇仲先弹起来，长矛连环扫劈，把从破洞追进来的敌人硬逼得退出去，正要乘势杀出时，一群弩箭手从洞开的大门抢进来，焦宏进见势不妙，掀翻置于迎客大堂一张以红木和云石镶嵌而成的大圆桌，以作挡箭之用。
      - paragraph [ref=f2e1124]: “笃笃”连声，十多枝弩箭全射到桌面做的临时挡箭牌去。
      - paragraph [ref=f2e1125]: “砰”！
      - paragraph [ref=f2e1126]: 另一边的后门被撞开，拥入无数以刀盾手和枪矛手为骨干的骆马帮众。
      - paragraph [ref=f2e1127]: 寇仲迅速移到另一圆桌处，抛开长矛，两手抓牢桌沿，先运功震碎桌脚，然后狂喝一声，运起旋劲，平胸推出。
      - paragraph [ref=f2e1128]: 历史再次重演，只不过把铁钹换上云石桌面，声势威力则尤有过之。